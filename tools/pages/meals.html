    <section class="page-section" aria-labelledby="gallery-title">
      <div class="page-intro">
        <h2 id="gallery-title" class="page-heading">今日も、食べるのが楽しみ。</h2>
        <div class="prose">
          <p>管理栄養士や調理スタッフがアイデアを出し合い、<br class="pc-only">食べやすさとおいしさを両立できるよう、献立を見直しています。</p>
        </div>
      </div>
      {{meal-gallery}}

    <dialog class="dish-viewer" aria-labelledby="dish-viewer-name">
      <div class="dish-viewer-inner">
        <figure class="dish-viewer-photo"><img src="" alt="" width="1600" height="1200"></figure>
        <div class="dish-viewer-copy">
          <p class="dish-viewer-tag"></p>
          <h2 id="dish-viewer-name" class="dish-viewer-name"></h2>
          <p class="dish-viewer-note"></p>
        </div>
        <button class="dish-viewer-nav dish-viewer-nav--prev" type="button" data-step="-1" aria-label="前の料理"><span aria-hidden="true"></span></button>
        <button class="dish-viewer-nav dish-viewer-nav--next" type="button" data-step="1" aria-label="次の料理"><span aria-hidden="true"></span></button>

      </div>
