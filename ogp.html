<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP書き出し用</title>
<!--
  OGP画像の版下。1200×630 で撮って images/ogp.png として保存する。

  LINEのトーク内カードは og:image を中央で正方形にクロップするので、
  文字はすべて中央 630×630（x=285〜915）の中に収める。
  .ogp__safe がそのセーフゾーンで、確認用に枠線を出せる（.is-guide を付ける）。

  書き出し（package.json に ogp のスクリプトは無い）：
    ヘッドレス Chrome で 1200×630・倍率1で撮り、images/ogp.png に上書きする。
    撮ったら README「OGP の注意」の ffmpeg で正方形に切って、文字が切れていないか目で見る
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { inline-size: 1200px; block-size: 630px; overflow: hidden; }

  body {
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "palt" 1;
  }

  .ogp {
    position: relative;
    inline-size: 1200px;
    block-size: 630px;
    overflow: hidden;
    background-color: #1f1b19;
    display: grid;
    place-items: center;
  }

  .ogp__bg,
  .ogp__bg-img {
    position: absolute;
    inset: 0;
    inline-size: 100%;
    block-size: 100%;
    object-fit: cover;
  }

  /* 文字を乗せるための暗幕。中央を強めに落として写真の端は残す */
  .ogp__scrim {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 62% 78% at 50% 52%, rgb(26 20 18 / 0.82) 0%, rgb(26 20 18 / 0.68) 58%, rgb(26 20 18 / 0.38) 100%),
      linear-gradient(to top, rgb(26 20 18 / 0.55) 0%, rgb(26 20 18 / 0.2) 60%);
  }

  /* LINEの正方形クロップに収まる範囲。ここから文字を出さない */
  .ogp__safe {
    position: relative;
    inline-size: 630px;
    block-size: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 40px 15px;
    text-align: center;
    color: #fff;
  }

  .ogp__safe.is-guide { outline: 2px dashed rgb(255 0 0 / 0.7); }

  .ogp__brand {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.16em;
    line-height: 1.4;
  }

  .ogp__brand-mark {
    display: block;
    inline-size: 46px;
    block-size: 3px;
    background-color: #e05a52;
    margin: 14px auto 0;
  }

  .ogp__title {
    font-size: 60px;
    font-weight: 700;
    line-height: 1.38;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 20px rgb(15 12 11 / 0.55);
  }

  .ogp__title-accent { color: #ffc9a3; }

  .ogp__lead {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.7;
    color: rgb(255 255 255 / 0.94);
  }

  .ogp__tel {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin-top: 6px;
    padding: 12px 30px;
    border-radius: 100rem;
    background-color: #c8322c;
  }

  .ogp__tel-num {
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-size: 31px;
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .ogp__tel-note { font-size: 15px; font-weight: 500; }
</style>
</head>
<body>

<div class="ogp">
  <div class="ogp__bg">
    <img class="ogp__bg-img" src="images/ogp-bg.jpg" alt="" width="1200" height="630">
  </div>
  <div class="ogp__scrim"></div>

  <div class="ogp__safe">
    <p class="ogp__brand">株式会社JINfoods<span class="ogp__brand-mark"></span></p>
    <h1 class="ogp__title">食で、<br>人と<span class="ogp__title-accent">地域</span>をつなぐ。</h1>
    <p class="ogp__lead">大分県で高齢者施設・病院の<br>給食を受託しています</p>
    <p class="ogp__tel">
      <span class="ogp__tel-num">097-574-9225</span>
      <span class="ogp__tel-note">6:00〜19:00／定休日なし</span>
    </p>
  </div>
</div>

</body>
</html>
